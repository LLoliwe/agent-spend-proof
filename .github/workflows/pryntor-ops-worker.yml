name: Pryntor bounded public-source worker
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
jobs:
  public-source-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Execute bounded read-only worker
        run: python3 pryntor-ops/worker.py
      - name: Publish run evidence
        uses: actions/upload-artifact@v4
        with:
          name: pryntor-ops-run-${{ github.run_id }}
          path: pryntor-ops-output/run.json
          retention-days: 7
