name: gpu-workload-screen-r0
on:
  pull_request:
    paths:
      - 'scripts/gpu_workload_screen.py'
      - 'tests/test_gpu_workload_screen.py'
      - 'docs/gpu_workloads_2026-10-17.json'
      - 'docs/gpu_quotes_2026-10-17.json'
      - 'docs/GPU_WORKLOAD_SCREEN_R0.md'
      - '.github/workflows/gpu-workload-screen-r0.yml'
  push:
    paths:
      - 'scripts/gpu_workload_screen.py'
      - 'tests/test_gpu_workload_screen.py'
      - 'docs/gpu_workloads_2026-10-17.json'
      - 'docs/gpu_quotes_2026-10-17.json'
      - 'docs/GPU_WORKLOAD_SCREEN_R0.md'
      - '.github/workflows/gpu-workload-screen-r0.yml'
permissions:
  contents: read
jobs:
  offline-no-spend-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Deterministic offline unit tests
        run: python3 -m unittest discover -s tests -p 'test_gpu_workload_screen.py' -v
      - name: Workload screen and provenance assertions
        run: |
          python3 scripts/gpu_workload_screen.py --workloads docs/gpu_workloads_2026-10-17.json --quotes docs/gpu_quotes_2026-10-17.json --minutes 15 > gpu_decisions.json
          python3 - <<'PY'
          import json
          with open('gpu_decisions.json') as f:
              r = json.load(f)
          assert r['purchases_initiated'] == 0
          assert r['savings_claim'] == 'NONE'
          assert len(r['workloads']) == 3
          assert all(j['buy_authorized'] is False and j['historical_realized_savings_usd'] is None for j in r['workloads'])
          assert len(r['illustrative_only']) == 4
          assert all(q['realized_savings_usd'] is None for q in r['illustrative_only'])
          print('PASS: zero charges, no fake savings, all three actual projects screened')
          PY
      - name: Retain decision evidence
        uses: actions/upload-artifact@v4
        with:
          name: gpu-r0-workload-decision-${{ github.sha }}
          path: gpu_decisions.json
          retention-days: 7
