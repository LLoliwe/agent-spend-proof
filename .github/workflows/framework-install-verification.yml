name: Pryntor framework installation verification
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/framework-install-verification.yml'
      - 'pryntor-ops/frameworks/**'
      - 'tests/test_framework_verification.py'
permissions:
  contents: read
concurrency:
  group: framework-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        framework: [langgraph, crewai, microsoft, openhands]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OTEL_SDK_DISABLED: 'true'
      CREWAI_TELEMETRY_DISABLED: 'true'
      DO_NOT_TRACK: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated framework dependencies
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input --timeout 20 --retries 1 -U pip
          case '${{ matrix.framework }}' in
            langgraph) PACKAGE='langgraph' ;;
            crewai) PACKAGE='crewai' ;;
            microsoft) PACKAGE='agent-framework-core' ;;
            openhands) PACKAGE='openhands-sdk' ;;
          esac
          .venv/bin/python -m pip install --disable-pip-version-check --no-input --timeout 20 --retries 1 "$PACKAGE"
      - name: Verify installed package and import
        shell: bash
        run: .venv/bin/python pryntor-ops/frameworks/verify_frameworks.py '${{ matrix.framework }}' | tee framework-verification.json
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-verification-${{ matrix.framework }}
          path: framework-verification.json
          if-no-files-found: ignore
          retention-days: 1
