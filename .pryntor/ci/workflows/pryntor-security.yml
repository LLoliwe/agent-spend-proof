# Managed by LLoliwe/pryntor-agent-skills (principles kit, P44/P45). R0: free tools only, no paid scanners, no secrets.
name: pryntor-security
on:
  pull_request:
    paths-ignore:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'PRINCIPLES*'
      - '.windsurfrules'
      - 'media-manifest.csv'
      - 'docs/adr/**'
      - 'docs/agents/**'
      - 'docs/security/**'
      - 'docs/brand/**'
      - 'docs/comms/**'
      - '.pryntor/**'
      - '.cursor/**'
      - '.claude/**'
      - '.github/copilot-instructions.md'
      - '.github/pull_request_template.md'
  push:
    branches: [main]
    paths-ignore:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'PRINCIPLES*'
      - '.windsurfrules'
      - 'media-manifest.csv'
      - 'docs/adr/**'
      - 'docs/agents/**'
      - 'docs/security/**'
      - 'docs/brand/**'
      - 'docs/comms/**'
      - '.pryntor/**'
      - '.cursor/**'
      - '.claude/**'
      - '.github/copilot-instructions.md'
      - '.github/pull_request_template.md'
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (pinned binary, full history)
        run: |
          curl -sSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks && ./gitleaks git --redact --exit-code 1 .
  sast-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install scanners (pinned)
        run: pip install "semgrep==1.185.0" "bandit[toml]==1.9.4" "pip-audit==2.10.1"
      - name: Semgrep OSS
        run: semgrep scan --error --metrics=off --config p/python --config p/secrets --config p/owasp-top-ten --config p/javascript .
      - name: Bandit (Python)
        run: |
          if git ls-files '*.py' | grep -q .; then bandit -r . -x ./.venv,./node_modules,./tests -ll; else echo "No Python files."; fi
      - name: pip-audit
        run: |
          shopt -s nullglob
          found=0
          for f in requirements*.txt; do found=1; pip-audit -r "$f" --strict; done
          if [ -f pyproject.toml ] && [ $found = 0 ]; then pip-audit . ; fi
          [ $found = 1 ] || [ -f pyproject.toml ] || echo "No Python dependency manifest."
      - name: osv-scanner (all ecosystems)
        run: |
          curl -sSL -o osv https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          echo "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8  osv" | sha256sum -c - && chmod +x osv
          ./osv scan source -r . || { rc=$?; [ $rc = 128 ] && echo "No lockfiles found." || exit $rc; }
      - name: Trivy config scan (IaC, Dockerfiles, workflows)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          exit-code: "1"
          severity: HIGH,CRITICAL
      - name: SBOM (syft, CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: cyclonedx-json
          artifact-name: sbom.cdx.json
      - name: No emoji glyphs in UI source (P52)
        run: python3 .pryntor/check-emoji.py
  codeql:
    # CodeQL is free for public repos only (R0). Skipped automatically on private repos.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python, javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
