[project]
name = "agent-spend-proof"
version = "0.1.0"
description = "An explicit, auditable spend-policy gateway for machine payments on Celo"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.100,<1", "uvicorn>=0.24,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
